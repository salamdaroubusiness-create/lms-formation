function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function addDays(iso,n){var d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}

function waNum(t){var d=digits(t);if(d.length===9&&d.charAt(0)==='7')d='221'+d;return d;}

function mdLite(t){ /* texte simple : paragraphes, puces, **gras** */
  var out=[],lst=false;String(t||'').split('\n').forEach(function(l){
    var s=esc(l).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    if(/^\s*[-•]\s+/.test(l)){if(!lst){out.push('<ul>');lst=true;}out.push('<li>'+s.replace(/^\s*[-•]\s+/,'')+'</li>');}
    else{if(lst){out.push('</ul>');lst=false;}if(l.trim())out.push('<p>'+s+'</p>');}
  });if(lst)out.push('</ul>');return out.join('');
}

function load(){

function byId(list,id){for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i];return null;}
function course(id){return byId(DB.courses,id);}
function pathOf(c){return c&&c.path?byId(DB.paths,c.path):null;}
function learner(id){return byId(DB.learners,id);}
function enr(id){return byId(DB.enrollments,id);}
function courseBySlug(s){for(var i=0;i<DB.courses.length;i++)if(DB.courses[i].slug===s)return DB.courses[i];return null;}
function pathBySlug(s){for(var i=0;i<DB.paths.length;i++)if(DB.paths[i].slug===s)return DB.paths[i];return null;}
function lessonsOf(c){var o=[];(c.modules||[]).forEach(function(m,mi){(m.lessons||[]).forEach(function(l,li){o.push({m:m,mi:mi,l:l,li:li});});});return o;}
function nbLessons(c){return lessonsOf(c).length;}
function modsInfo(c){var n=nbLessons(c),ex=lessonsOf(c).filter(function(x){return x.l.type==='devoir';}).length;return (c.modules||[]).length+' modules · '+n+' leçons'+(ex?' · '+ex+' exercices':'');}
function fmtIcon(f){return f==='Présentiel'?'En présentiel':f==='Mixte'?'Mixte':'En ligne';}
function progressOf(e){var c=course(e.courseId);if(!c)return 0;var L=lessonsOf(c);if(!L.length)return 0;var n=0;L.forEach(function(x){if(e.done&&e.done[x.l.id])n++;});return Math.round(n/L.length*100);}
function quizOf(c){return (c.quiz&&c.quiz.length)?c.quiz:(DB.bank[c.cat]||[]);}
function canCertify(e){var c=course(e.courseId);if(!c||e.status!=='payé')return false;if(progressOf(e)<100)return false;var q=quizOf(c);if(c.certificate===false)return false;if(q.length&&!(e.quiz&&e.quiz.score>=60))return false;return true;}
function issueCert(e){
  if(e.cert)return e.cert;var l=learner(e.learnerId),c=course(e.courseId);
  var code='GSC-'+new Date().getFullYear()+'-'+rcode(6);
  e.cert={code:code,date:today()};
  DB.certs.push({code:code,name:l.name,course:c.title,hours:hoursOf(c),date:today(),level:c.level});save();return e.cert;
}
function nextSessions(courseId){var t=today();return DB.sessions.filter(function(s){return (!courseId||s.courseId===courseId)&&s.status!=='annulée'&&s.start>=t;}).sort(function(a,b){return a.start<b.start?-1:1;});}
function sessionFull(s){var n=DB.enrollments.filter(function(e){return e.sessionId===s.id&&e.status!=='annulé';}).length;return {n:n,left:Math.max(0,(+s.capacity||0)-n)};}
function priceOf(c){return +c.price||0;}

/* ---------- durées : calculées à partir des leçons ---------- */
function hoursOf(c){var m=0;lessonsOf(c).forEach(function(x){m+=+x.l.dur||0;});var h=m/60+(+c.extraHours||0);return h?Math.max(0.5,Math.round(h*2)/2):0;}
function hh(c){return String(hoursOf(c)).replace('.',',');}
function fitDur(c,target){ /* adapte les durées d'exemple pour que le total corresponde à la durée annoncée */
  var L=lessonsOf(c),m=0;L.forEach(function(x){m+=+x.l.dur||0;});
  var share=c.format==='En ligne'?1:(c.format==='Mixte'?0.6:0.2),want=target*60*share,k=m?want/m:1;
  L.forEach(function(x){if(!x.l.durAuto)x.l.dur=Math.max(3,Math.round(x.l.dur*k/5)*5);});
  var s=0;L.forEach(function(x){s+=+x.l.dur||0;});c.extraHours=Math.max(0,Math.round((target-s/60)*2)/2);
}
var YTP=null;
function ytReady(){if(YTP)return YTP;YTP=new Promise(function(res,rej){if(window.YT&&YT.Player)return res();var t=setTimeout(function(){rej();},8000);window.onYouTubeIframeAPIReady=function(){clearTimeout(t);res();};var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=function(){rej();};document.head.appendChild(s);});return YTP;}
function detectDur(url){ /* secondes, ou 0 si le lien ne permet pas de la lire */
  url=safeUrl(url);if(!url)return Promise.resolve(0);var m;
  if((m=/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{6,})/.exec(url))){
    return ytReady().then(function(){return new Promise(function(res){var host=document.createElement('div');host.style.cssText='position:fixed;left:-9999px;width:200px;height:120px';var inner=document.createElement('div');host.appendChild(inner);document.body.appendChild(host);var done=false;function fin(v){if(done)return;done=true;try{host.remove();}catch(e){}res(v);}
      setTimeout(function(){fin(0);},10000);
      new YT.Player(inner,{videoId:m[1],events:{onReady:function(e){var n=0;(function poll(){var d=e.target.getDuration();if(d>0)fin(d);else if(n++<10)setTimeout(poll,500);else fin(0);})();},onError:function(){fin(0);}}});});}).catch(function(){return 0;});
  }
  if((m=/(?:cloudflarestream\.com|videodelivery\.net)\/(?:embed\/[\w.]+\/)?([0-9a-f]{32})/i.exec(url)))return new Promise(function(res){
    var ifr=document.createElement('iframe');ifr.style.cssText='position:fixed;left:-9999px;width:200px;height:120px';ifr.src='https://iframe.videodelivery.net/'+m[1];ifr.allow='autoplay';var done=false;
    function fin(v){if(done)return;done=true;try{ifr.remove();}catch(e){}res(v);}setTimeout(function(){fin(0);},12000);
    var s=document.createElement('script');s.src='https://embed.cloudflarestream.com/embed/sdk.latest.js';s.onerror=function(){fin(0);};
    s.onload=function(){document.body.appendChild(ifr);try{var pl=Stream(ifr);pl.addEventListener('loadedmetadata',function(){fin(pl.duration||0);});pl.addEventListener('durationchange',function(){if(pl.duration>0)fin(pl.duration);});}catch(e){fin(0);}};
    document.head.appendChild(s);});
  if(/vimeo\.com\//.test(url))return fetch('https://vimeo.com/api/oembed.json?url='+encodeURIComponent(url)).then(function(r){return r.json();}).then(function(j){return +j.duration||0;}).catch(function(){return 0;});
  if(/\.(mp4|webm|m4v|mov|mp3|m4a|wav|ogg)(\?|#|$)/i.test(url)||/^data:(audio|video)/.test(url))return new Promise(function(res){var v=document.createElement('video');v.preload='metadata';var t=setTimeout(function(){res(0);},10000);v.onloadedmetadata=function(){clearTimeout(t);res(isFinite(v.duration)?v.duration:0);};v.onerror=function(){clearTimeout(t);res(0);};v.src=url;});
  return Promise.resolve(0);
}
function autoDur(cid,lid){
  var c=course(cid),L=c&&lessonsOf(c).filter(function(x){return x.l.id===lid;})[0];if(!L||L.l.type!=='video'||!L.l.url)return;
  toast('Calcul de la durée de la vidéo…');
  detectDur(L.l.url).then(function(sec){
    if(sec>0){L.l.dur=Math.max(1,Math.ceil(sec/60));L.l.durAuto=true;save();toast('Durée détectée : '+L.l.dur+' min. La durée de la formation est mise à jour.');render();}
    else toast('Durée non lisible pour ce lien (Google Drive, par exemple) : saisissez-la à la main.');
  });
}

function sendOrder(o){
  var u=safeUrl(DB.settings.svcUrl);if(!u)return Promise.resolve(false);
  return fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)}).then(function(r){return r.json();}).then(function(r){return r.status==='ok';}).catch(function(){return false;});
}

  if((m=/vimeo\.com\/(\d+)/.exec(u)))return 'https://player.vimeo.com/video/'+m[1];

function render(){

  if(q.ref&&/^GSC[A-Z0-9]{5}$/i.test(q.ref))UI.f.ref=q.ref.toUpperCase();
  var ae=document.activeElement,fid=ae&&ae.id,fs=ae&&ae.selectionStart,y=window.scrollY,same=UI.lastHash===location.hash;UI.lastHash=location.hash;

  else{
    var body=pubRoute(r);
    if(body===null){
      if(r.v==='connexion')body=pageLogin();else if(r.v==='espace')body=r.a?pagePlayer(r.a,r.b):pageSpace();else body=notFound();
    }
    html=header(r)+'<main id="main">'+body+'</main>'+footer();document.title=S().name+' · Formations';
  }
  app.innerHTML=html+UI.modal;
  if(!same)window.scrollTo(0,0);else window.scrollTo(0,y);

}
/* ---------- inscriptions ---------- */
function findLearner(phone,email){var d=digits(phone).slice(-9),em=String(email||'').toLowerCase();return DB.learners.filter(function(l){return (em&&l.email&&l.email.toLowerCase()===em)||(d.length>=8&&digits(l.phone).slice(-9)===d);})[0];}
function makeEnrol(o){
  var l=findLearner(o.phone,o.email);
  if(!l){l={id:'l_'+uid(),name:o.name,email:o.email||'',phone:o.phone,code:rcode(4)+'-'+rcode(4),created:today()};DB.learners.push(l);}
  var out=[];
  o.items.forEach(function(it){
    var ex=DB.enrollments.filter(function(e){return e.learnerId===l.id&&e.courseId===it.c.id&&e.status!=='annulé';})[0];
    if(ex){out.push(ex);return;}
    var e={id:'e_'+uid(),learnerId:l.id,courseId:it.c.id,status:o.status,amount:it.amount,method:o.method,date:today(),done:{},quiz:null,cert:null,ref:o.ref||'',sessionId:o.items.length===1?(o.sessionId||''):''};
    DB.enrollments.push(e);out.push(e);
  });
  save();return {l:l,es:out};
}
function enrolItems(kind,id,ref){
  var disc=refValid(ref)?S().refDisc/100:0,items=[],title='';
  if(kind==='p'){var p=byId(DB.paths,id);if(!p)return null;title=p.title;var cs=DB.courses.filter(function(c){return c.path===p.id;}).sort(function(a,b){return a.pos-b.pos;}),sum=0;cs.forEach(function(c){sum+=priceOf(c);});cs.forEach(function(c){items.push({c:c,amount:Math.round((sum?p.price*priceOf(c)/sum:0)*(1-disc))});});}
  else{var c=course(id);if(!c)return null;title=c.title;items.push({c:c,amount:Math.round(priceOf(c)*(1-disc))});}
  return {items:items,title:title,total:items.reduce(function(a,x){return a+x.amount;},0)};
}
function submitEnrol(f){
  var d=new FormData(f),kind=f.dataset.kind,id=f.dataset.id,name=String(d.get('name')||'').trim(),phone=String(d.get('phone')||'').trim(),email=String(d.get('email')||'').trim(),method=String(d.get('method')||'Wave'),sid=String(d.get('session')||''),ref=String(d.get('ref')||'').trim().toUpperCase(),msg=$('#enmsg');
  if(name.length<2){msg.textContent='Indiquez votre nom et prénom.';return;}
  if(digits(phone).length<8){msg.textContent='Indiquez un numéro de téléphone valide.';return;}
  if(email&&!/^\S+@\S+\.\S+$/.test(email)){msg.textContent='Cette adresse e-mail semble incorrecte.';return;}
  if(ref&&refOf(phone)===ref)ref='';
  if(ref&&!refValid(ref)){msg.textContent='Ce code de parrainage n’existe pas. Corrigez-le ou laissez la case vide.';return;}
  var it=enrolItems(kind,id,ref);if(!it){msg.textContent='Formation introuvable.';return;}
  var free=it.total===0,T={name:name,title:it.title,amount:it.total,method:method,ref:ref,free:false};
  var summary='Bonjour, je m’inscris à « '+it.title+' ». Nom : '+name+', tél : '+phone+(email?', e-mail : '+email:'')+(ref?', code parrain : '+ref:'')+'. Montant : '+money(it.total)+', paiement par '+method+'.';
  var order={type:'commande',name:name,phone:phone,email:email,subject:'Inscription : '+it.title,message:summary,montant:it.total,paiement:method.slice(0,20)};
  if(VITRINE){sendOrder(order);UI.thanks=T;window.open(wlink(summary),'_blank','noopener');go('#/merci/x');return;}
  var res=makeEnrol({name:name,phone:phone,email:email,items:it.items,method:method,ref:ref,sessionId:sid,status:free?'payé':'en attente'});
  sendOrder(order);
  UI.thanks=T;if(free){T.free=true;T.code=res.l.code;}
  go('#/merci/'+res.es[0].id);
}
function payModal(e){

function setField(el){
  var k=el.dataset.k,f=el.dataset.f,id=el.dataset.id,v;
  if(el.type==='checkbox')v=el.checked;else if(el.dataset.num)v=+el.value||0;else if(el.dataset.lines)v=el.value.split('\n').map(function(x){return x.trim();}).filter(Boolean);else v=el.value;
  var o=null;
  if(k==='course'){o=course(id);if(o&&f==='slug')v=slugify(v);if(o&&f==='path'&&!v)v=null;}
  else if(k==='mod'||k==='les'){var c=course(id);if(c){var m=(c.modules||[]).filter(function(x){return x.id===el.dataset.m;})[0];o=k==='mod'?m:(m&&m.lessons.filter(function(x){return x.id===el.dataset.l;})[0]);}}
  else if(k==='path')o=byId(DB.paths,id);else if(k==='sess')o=byId(DB.sessions,id);else if(k==='proj')o=byId(DB.projects,id);
  else if(k==='task'){var p=byId(DB.projects,id);o=p&&byId(p.tasks,el.dataset.m);}
  else if(k==='set')o=DB.settings;else if(k==='enr')o=byId(DB.enrollments,id);else if(k==='learner')o=learner(id);
  if(k==='quiztxt'){var c2=course(id);if(c2){c2.quiz=textToQuiz(el.value);}save();return;}
  if(k==='set'&&f==='faqtxt'){var L=el.value.split('\n').map(function(x){var i=x.indexOf('|');return i<0?null:[x.slice(0,i).trim(),x.slice(i+1).trim()];}).filter(function(x){return x&&x[0]&&x[1];});if(L.length)DB.faq=L;else delete DB.faq;save();return;}
  if(!o)return;o[f]=v;if(k==='les'&&f==='dur')o.durAuto=false;save();if(k==='les'&&f==='url'&&v)autoDur(id,el.dataset.l);
}
function mv(arr,i,d){var j=i+d;if(j<0||j>=arr.length)return;var t=arr[i];arr[i]=arr[j];arr[j]=t;}
function csvCell(x){x=String(x==null?'':x);return /[",;\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}
function exportVitrine(){
  var d=JSON.parse(JSON.stringify(DB));
  d.courses=d.courses.filter(function(c){return c.published!==false;});
  d.learners=[];d.questions=[];d.leads=[];d.projects=[];d.referrers=[];d.settings.svcUrl=d.settings.svcUrl||'';
  d.enrollments=DB.enrollments.filter(function(e){return e.sessionId&&e.status!=='annulé';}).map(function(e){return {sessionId:e.sessionId,status:e.status};});

  var html='<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(S().name)+' · Formations</title><style id="appcss">'+css+'</style></head><body><div id="app"></div><script>window.__VITRINE__=true;window.__DATA__='+data+';<\/script><script id="appjs">'+js+'<\/script></body></html>';

  if(t.hasAttribute('data-asearch')){UI.adm.q=t.value;render();return;}
  if(t.hasAttribute('data-lsearch')){UI.adm.lq=t.value;render();return;}
  if(t.dataset.k&&t.type!=='checkbox'&&t.tagName!=='SELECT'&&!t.dataset.rr)setField(t);
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.dataset.f&&!t.dataset.k){UI.f[t.dataset.f]=t.value;render();return;}
  if(t.hasAttribute('data-att')){var s=byId(DB.sessions,t.dataset.id);s.att=s.att||{};s.att[t.dataset.e]=t.checked;save();return;}
  if(t.hasAttribute('data-restore')){var f=t.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){try{var o=JSON.parse(fr.result);if(!o.courses||!o.settings)throw 0;if(!confirm('Remplacer toutes les données par cette sauvegarde ?'))return;DB=o;migrate();save();toast('Sauvegarde restaurée');render();}catch(e){toast('Fichier de sauvegarde invalide.');}};fr.readAsText(f);return;}
  if(t.dataset.k){setField(t);if(t.dataset.rr)render();}
});
/* ---------- formulaires ---------- */
document.addEventListener('submit',function(ev){
  var f=ev.target,k=f.dataset.form;if(!k)return;ev.preventDefault();var d=new FormData(f),v=function(n){return String(d.get(n)||'').trim();};
  if(k==='lead'){
    var nm=v('name'),ct=v('contact');if(!nm||!ct)return;
    if(VITRINE){sendOrder({type:'contact',name:nm,phone:ct,email:ct.indexOf('@')>-1?ct:'',subject:'Demande du guide gratuit',message:'Demande du guide gratuit'});window.open(wlink('Bonjour, je voudrais recevoir le guide gratuit. Je m’appelle '+nm+' ('+ct+').'),'_blank','noopener');}
    else{DB.leads.push({id:uid(),name:nm,contact:ct,date:today()});save();sendOrder({type:'contact',name:nm,phone:ct,email:ct.indexOf('@')>-1?ct:'',subject:'Demande du guide gratuit',message:'Demande du guide gratuit'});}
    f.reset();toast('Merci '+nm+' ! Nous vous envoyons le guide.');return;
  }
  if(k==='enrol'){submitEnrol(f);return;}
  if(k==='verify'){var c=v('code').toUpperCase();UI.f.vc=c;if(location.hash==='#/certificat/'+encodeURIComponent(c))render();else go('#/certificat/'+encodeURIComponent(c));return;}
  if(k==='ref'){var ph=v('phone'),nm2=v('name');if(digits(ph).length<8){toast('Numéro invalide');return;}var code=refOf(ph);if(!VITRINE){DB.referrers=DB.referrers||[];if(!DB.referrers.some(function(r){return r.code===code;}))DB.referrers.push({code:code,name:nm2,phone:ph,date:today()});save();}UI.f.rc=code;render();return;}
  if(k==='login'){var l=loginDo(v('id'),v('code'));if(!l){$('#lgmsg').textContent='E-mail, téléphone ou code incorrect.';return;}ssSet(KEYLRN,l.id);go('#/espace');render();return;}
  if(k==='unlock'){var okp=false;try{okp=localStorage.getItem(KEYPIN)===h53('gscpin'+d.get('pin'||''));}catch(e){}var pv=document.getElementById('pin').value;try{okp=localStorage.getItem(KEYPIN)===h53('gscpin'+pv);}catch(e){}if(!okp){$('#pinmsg').textContent='Code incorrect.';return;}ssSet('gscLmsAdm','1');render();return;}
  if(k==='manual'){var c3=course(v('course'));if(!c3)return;var nm3=v('name'),ph3=v('phone');if(digits(ph3).length<8){toast('Téléphone invalide');return;}var st=v('status');var res=makeEnrol({name:nm3,phone:ph3,email:v('email'),items:[{c:c3,amount:priceOf(c3)}],method:'Espèces / sur place',ref:'',status:st});UI.modal='';render();if(st==='payé')payModal(res.es[0]);else toast('Inscription ajoutée');return;}
  /* espace apprenant */
  var l2=curLearner();
  if(k==='devoir'||k==='quiz'||k==='ask'){
    var e=enr(f.dataset.e);if(!e||!l2||e.learnerId!==l2.id)return;var lid=f.dataset.l;e.done=e.done||{};
    if(k==='devoir'){e.answers=e.answers||{};e.answers[lid]={text:v('text'),date:today()};if(e.fb)delete e.fb[lid];e.done[lid]=true;save();toast('Travail envoyé');render();}
    else if(k==='quiz'){var Q=quizOf(course(e.courseId)),ok=0;Q.forEach(function(q,i){if(+d.get('q'+i)===q.a)ok++;});var sc=Q.length?Math.round(ok/Q.length*100):0;e.quiz={score:sc,date:today()};if(sc>=60)e.done[lid]=true;save();toast('Résultat : '+sc+' %');render();}
    else{DB.questions.push({id:uid(),learnerId:l2.id,enrId:e.id,lessonId:lid,text:v('text'),date:today(),answer:''});save();toast('Question envoyée');render();}
  }
});
/* reprise de lecture des vidéos en fichier */
document.addEventListener('loadedmetadata',function(ev){var v=ev.target;if(!v.dataset||!v.dataset.vid)return;var p=0;try{p=+localStorage.getItem('gscLmsPos_'+v.dataset.vid)||0;}catch(e){}if(p>5&&p<v.duration-5)v.currentTime=p;},true);
document.addEventListener('timeupdate',function(ev){var v=ev.target;if(!v.dataset||!v.dataset.vid)return;var t=Math.floor(v.currentTime);if(t%5===0&&t!==v._lt){v._lt=t;try{localStorage.setItem('gscLmsPos_'+v.dataset.vid,String(t));}catch(e){}}},true);
window.addEventListener('hashchange',function(){UI.modal='';render();});
function init(){
  load();
  if(!VITRINE){ /* repasse en démo si le contenu est corrompu */ }
  render();
}
init();

</script></body></html>
